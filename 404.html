<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brevet kom ikke frem – Najma Abdi</title>
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="stylesheet" href="/styles.css">
<style>
  body { min-height: 100vh; display: grid; place-items: center; background-image: url("/assets/images/wallpaper.svg"); }
  .lost { max-width: 560px; margin: 24px; text-align: center; background: #FFF3F5; }
  .lost h1 { font-size: clamp(2.2rem, 7vw, 3.2rem); margin: 6px 0 12px; }
  .lost p { margin: 0 auto 24px; max-width: 40ch; }
  .lost .actions { justify-content: center; }
</style>
</head>
<body>
  <main class="note lost">
    <span class="tape pink left" aria-hidden="true"></span>
    <span class="tape butter right" aria-hidden="true"></span>
    <p class="sub">Oi!</p>
    <h1>Dette brevet kom ikke frem</h1>
    <p>Siden du lette etter finnes ikke, men esken med brevene mine står fortsatt klar på forsiden.</p>
    <div class="actions">
      <a class="btn btn-main" href="/">Tilbake til forsiden</a>
    </div>
  </main>
</body>
</html>
